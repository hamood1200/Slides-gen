  <rect x="66" y="600" width="28" height="28"/><rect x="226" y="600" width="28" height="28"/><rect x="346" y="600" width="28" height="28"/><rect x="506" y="600" width="28" height="28"/>
  <text x="50" y="740" font-size="16">FEEDERS TO THE DISTRIBUTION NETWORK</text>
  <path d="M0 772 H600" stroke-width="1.5"/>
