  <text x="34" y="280">T1</text><text x="34" y="306" font-size="16">67 MVA</text>
  <path d="M430 90 V130 M430 178 V220 M430 390 V440 M430 488 V540"/>
  <rect x="406" y="130" width="48" height="48"/><rect x="406" y="440" width="48" height="48"/>
  <circle cx="430" cy="270" r="50"/><circle cx="430" cy="340" r="50" class="acc"/>
  <text x="494" y="280">T2</text><text x="494" y="306" font-size="16">67 MVA</text>
  <text x="494" y="330" font-size="16">Z 12 %</text>
