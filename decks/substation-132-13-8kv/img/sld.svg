<svg class="sld" direction="ltr" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="3" font-size="20">
  <!-- incoming 132 kV lines -->
  <path d="M170 20 V90 M158 38 l12 -18 l12 18 M430 20 V90 M418 38 l12 -18 l12 18"/>
