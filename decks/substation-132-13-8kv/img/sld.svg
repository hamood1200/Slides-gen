  <!-- 132 kV bus -->
  <path d="M60 90 H540" stroke-width="7"/><text x="60" y="76">132 kV</text>
  <!-- two transformer bays -->
  <path d="M170 90 V130 M170 178 V220 M170 390 V440 M170 488 V540"/>
  <rect x="146" y="130" width="48" height="48"/><rect x="146" y="440" width="48" height="48"/>
